name: Build Windows Player (.NET 4.7.2)

on:
  push:
    branches:
      - master
      - develop
      - 'olie-*'
  pull_request:
    branches:
      - master
      - develop
      - 'olie-*'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - 'Release'
          - 'Debug'

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'x86'
            name: 'x86'
          - platform: 'Any CPU'
            name: 'AnyCPU'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup NuGet CLI
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: nuget restore XiboClient.sln

      - name: Build Player Solution
        run: msbuild XiboClient.sln /p:Configuration=${{ github.event.inputs.configuration || 'Release' }} /p:Platform="${{ matrix.platform }}" /p:GenerateSerializationAssemblies=On /m

      - name: Locate Output Directory
        id: locate_output
        shell: pwsh
        run: |
          $config = if ("${{ github.event.inputs.configuration }}" -ne "") { "${{ github.event.inputs.configuration }}" } else { "Release" }
          $platform = "${{ matrix.platform }}"
          
          if ($platform -eq "x86") {
            $outPath = "bin\x86\$config"
          } else {
            $outPath = "bin\$config"
          }
          
          if (-Not (Test-Path $outPath)) {
            Write-Error "Output directory $outPath not found!"
            exit 1
          }
          
          Write-Host "Found build output at: $outPath"
          "outputPath=$outPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify Key Artifacts
        shell: pwsh
        run: |
          $out = "${{ steps.locate_output.outputs.outputPath }}"
          $required = @("OmnixPlayer.exe", "OmnixPlayer.XmlSerializers.dll", "Xibo.scr")
          foreach ($file in $required) {
            $p = Join-Path $out $file
            if (Test-Path $p) {
              Write-Host "✓ Found $file"
            } else {
              Write-Warning "⚠️ Warning: $file was not found in $out"
            }
          }

      - name: Build MSI Installer
        id: build_msi
        shell: pwsh
        run: |
          $wixBin = "${env:WIX}bin"
          if (-Not (Test-Path "$wixBin\candle.exe")) {
            Write-Warning "WiX toolset not found at $wixBin, trying PATH..."
            $candle = (Get-Command "candle.exe" -ErrorAction SilentlyContinue)
            if ($candle) {
              $wixBin = Split-Path $candle.Source
            } else {
              Write-Error "WiX Toolset (candle.exe) was not found!"
              exit 1
            }
          }

          $outPath = (Resolve-Path "${{ steps.locate_output.outputs.outputPath }}").Path
          $msiDir = "installer-output"
          New-Item -ItemType Directory -Force -Path $msiDir | Out-Null
          
          $msiName = "omnix-player-v4-R407.2-win32-${{ matrix.name }}.msi"
          $msiPath = Join-Path (Resolve-Path $msiDir).Path $msiName
          
          Write-Host "Harvesting files from: $outPath"
          & "$wixBin\heat.exe" dir "$outPath" -cg OmnixFiles -dr INSTALLFOLDER -scom -sreg -sfrag -srd -var var.SourceDir -out "installer\OmnixFiles.wxs"
          
          Write-Host "Compiling WiX sources..."
          $arch = if ("${{ matrix.name }}" -eq "x86") { "x86" } else { "x64" }
          & "$wixBin\candle.exe" -arch $arch -dPlatform=$arch -dSourceDir="$outPath" installer\Product.wxs installer\OmnixFiles.wxs -out "installer\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          Write-Host "Linking MSI package: $msiPath"
          & "$wixBin\light.exe" -sice:ICE38 -sice:ICE64 -sice:ICE91 installer\Product.wixobj installer\OmnixFiles.wixobj -out $msiPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          if (-Not (Test-Path $msiPath)) {
            Write-Error "MSI file was not created!"
            exit 1
          }
          
          Write-Host "✓ Successfully generated MSI: $msiPath"
          "msiPath=$msiPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "msiName=$msiName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload MSI Installer Package
        uses: actions/upload-artifact@v4
        with:
          name: omnix-player-v4-R407.2-win32-${{ matrix.name }}.msi
          path: installer-output/*.msi
          retention-days: 14

      - name: Upload Build Artifacts (Raw Files)
        uses: actions/upload-artifact@v4
        with:
          name: OmnixPlayer-${{ matrix.name }}-${{ github.sha }}
          path: ${{ steps.locate_output.outputs.outputPath }}
          retention-days: 14
